version: '3.8'

services:
  # OnlyOffice服务（支持中文环境及中文字体）
  onlyoffice:
    build:
      context: ./deploy-docker/onlyoffice-redis-node-nginx
      dockerfile: Dockerfile
    container_name: onlyoffice
    ports:
      - "8000:80"
    environment:
      - DB_HOST=pgDB
      - DB_PORT=5432
      - DB_NAME=onlyofficeDB
      - DB_USER=lq
      - DB_PASS=${ONLYOFFICE_DB_PASS}
      - JWT_ENABLED=false
    depends_on:
      # 使用服务名称而不是容器名称
      - pgDB
      - rabbitmq
      - aiccg-boot-redis
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - ./deploy-docker/onlyoffice-redis-node-nginx/fontsCN:/usr/share/fonts/truetype/fontsCN:ro
      - ./deploy-docker/onlyoffice-redis-node-nginx/local.json:/etc/onlyoffice/documentserver/local.json:ro
      - ./deploy-docker/onlyoffice-redis-node-nginx/run-document-server.sh:/app/ds/run-document-server.sh:ro
      - ./deploy-docker/onlyoffice-redis-node-nginx/start.sh:/usr/local/bin/start.sh:ro
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL服务（使用已构建的PostGIS和pgvector扩展）
  pgDB:
    image: pg18-pgvector-postgis:v1.0
    build:
      context: ./deploy-docker/pg18-postgis-vector
      dockerfile: Dockerfile
    container_name: pgDB
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aiccgDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=onlyofficeDB,redisDB,minioDBs,elasticsearch
      - POSTGRES_MULTIPLE_USERS=lq:${POSTGRES_USER_PASSWORD}
      - ENABLE_EXTENSIONS=aiccgDB:vector,postgis,postgis_topology,fuzzystrmatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backup
      - ./deploy-docker/pg18-postgis-vector/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - aiccg-networks
    healthcheck:
      # 修正环境变量引用
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MinIO对象存储服务
  aiccg-boot-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: aiccg-boot-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis缓存服务
  aiccg-boot-redis:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/redis:5.0
    restart: always
    hostname: aiccg-boot-redis
    container_name: aiccg-boot-redis
    ports:
      - "6379:6379"
    networks:
      - aiccg-networks
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # RabbitMQ消息队列服务
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - aiccg-networks
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Elasticsearch服务
  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # AICCG Boot系统服务
  aiccg-boot-system:
    build:
      context: ./jeecg-boot/jeecg-module-system/jeecg-system-start
    restart: on-failure
    depends_on:
      # 使用服务名称而不是容器名称
      - pgDB
      - aiccg-boot-redis
      - aiccg-boot-minio
    container_name: aiccg-boot-system
    image: aiccg-boot-system
    hostname: aiccg-boot-system
    ports:
      - 8080:8080
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/jeecg-boot/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Vue前端服务
  aiccg-vue:
    build:
      context: ./jeecgboot-vue3
    container_name: aiccg-vue3-nginx
    image: aiccg-vue3
    depends_on:
      - aiccg-boot-system
    networks:
      - aiccg-networks
    ports:
      - 80:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 持久化卷配置
volumes:
  # PostgreSQL数据卷
  postgres_data:
  postgres_backup:
  # OnlyOffice数据卷
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  # MinIO数据卷
  minio_data:
  # Redis数据卷
  redis_data:
  # RabbitMQ数据卷
  rabbitmq_data:
  # Elasticsearch数据卷
  elasticsearch_data:

# 网络配置
networks:
  aiccg-networks:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16