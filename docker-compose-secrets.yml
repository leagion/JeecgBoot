version: '3.8'

services:
  # PostgreSQL服务（使用已构建的PostGIS和pgvector扩展）
  pgDB:
    image: pg18-pgvector-postgis:v1.0
    build:
      context: ./deploy-docker/pg18-postgis-vector
      dockerfile: Dockerfile
    container_name: pgDB
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aiccgDB
      - POSTGRES_USER=postgres
    secrets:
      - postgres_password
      - postgres_user_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backup
      - ./deploy-docker/pg18-postgis-vector/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - aiccg-networks
    healthcheck:
      # 修正环境变量引用
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis缓存服务
  aiccg-boot-redis:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/redis:5.0
    restart: always
    hostname: aiccg-boot-redis
    container_name: aiccg-boot-redis
    ports:
      - "6379:6379"
    networks:
      - aiccg-networks
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_user_password:
    file: ./secrets/postgres_user_password
  redis_password:
    file: ./secrets/redis_password
  minio_password:
    file: ./secrets/minio_password
  rabbitmq_password:
    file: ./secrets/rabbitmq_password

# 持久化卷配置
volumes:
  # PostgreSQL数据卷
  postgres_data:
  postgres_backup:
  # Redis数据卷
  redis_data:

# 网络配置
networks:
  aiccg-networks:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16