version: '3'

networks:
  onlyoffice:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
  onlyoffice_data:
    driver: local

services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.8-management
    networks:
      - onlyoffice
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=onlyoffice
      - RABBITMQ_DEFAULT_PASS=onlyoffice123
      - RABBITMQ_DEFAULT_VHOST=/
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  onlyoffice:
    container_name: onlyoffice
    image: onlyoffice/documentserver:7.4
    networks:
      - onlyoffice
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
    environment:
      - RABBITMQ_SERVER_URL=amqp://onlyoffice:onlyoffice123@rabbitmq
      - RABBITMQ_SERVER_PORT=5672
    entrypoint: ["/bin/bash", "-c", "sleep 10 && echo 'RabbitMQ initialized, starting OnlyOffice...' && /app/onlyoffice/run-document-server.sh"]