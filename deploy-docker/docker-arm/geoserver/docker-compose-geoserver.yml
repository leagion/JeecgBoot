version: '3.8'

services:
  geoserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: geoserver-arm64:v1.0
    container_name: geoserver
    ports:
      - "8081:8080"
    environment:
      - GEOSERVER_DATA_DIR=/opt/geoserver/data_dir
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - GEOSERVER_ADMIN_USER=admin
    volumes:
      - ../geoserver_data:/opt/geoserver/data_dir
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  geoserver_data:
    external: false

networks:
  aiccg-networks:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16