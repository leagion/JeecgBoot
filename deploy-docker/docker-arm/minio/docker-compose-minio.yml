version: '3.8'

services:
  aiccg-boot-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: aiccg-boot-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ../minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  minio_data:
    external: false

networks:
  aiccg-networks:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16