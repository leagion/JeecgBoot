services:
  # PostgreSQL服务（使用已构建的PostGIS和pgvector扩展）
  pgDB:
    image: pg18-pgvector-postgis:v1.0
    build:
      context: ./pg18-postgis-vector
      dockerfile: Dockerfile
    container_name: pgDB
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aiccgDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=onlyofficeDB,redisDB,minioDBs,elasticsearch,aiDB,mapDB
      - POSTGRES_MULTIPLE_USERS=lq:${POSTGRES_USER_PASSWORD}
      - ENABLE_EXTENSIONS=mapDB:postgis,postgis_topology,fuzzystrmatch;aiDB:vector,fuzzystrmatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backup
      - ./pg18-postgis-vector/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - aiccg-networks
    healthcheck:
      # 修正环境变量引用
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MinIO对象存储服务
  aiccg-boot-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: aiccg-boot-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis缓存服务
  aiccg-boot-redis:
    image: redis:5.0
    restart: always
    hostname: aiccg-boot-redis
    container_name: aiccg-boot-redis
    ports:
      - "6379:6379"
    networks:
      - aiccg-networks
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # RabbitMQ消息队列服务 (已修复配置)
  # 修复了OnlyOffice连接问题，确保使用正确的认证信息
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=onlyoffice
      - RABBITMQ_DEFAULT_PASS=onlyoffice
      - RABBITMQ_LOAD_DEFINITIONS=/etc/rabbitmq/definitions.json
      # 启用guest用户远程访问（如果需要）
      - RABBITMQ_ALLOW_GUEST_LOGIN=true
    networks:
      - aiccg-networks
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # 修复：移除只读限制，允许RabbitMQ正确加载定义文件
      - ./pg18-postgis-vector/init-scripts/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 确保配置文件存在且有正确的权限
    command: sh -c "chmod 644 /etc/rabbitmq/definitions.json && rabbitmq-server"

  # Elasticsearch服务
  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # OnlyOffice服务（支持中文环境及中文字体）- 已修复配置
  # 修复了RabbitMQ连接问题和配置文件权限问题
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    ports:
      - "8000:80"
    environment:
      - DB_TYPE=postgres
      - DB_HOST=pgDB
      - DB_PORT=5432
      - DB_NAME=onlyofficeDB
      - DB_USER=onlyoffice
      - DB_PASS=hkzdlq@CCG2025
      - REDIS_SERVER_HOST=aiccg-boot-redis
      - REDIS_SERVER_PORT=6379
      - REDIS_SERVER_PWD=redispassword123
      # 修复：使用正确的RabbitMQ认证信息
      - AMQP_URI=amqp://onlyoffice:onlyoffice@rabbitmq:5672
      - JWT_ENABLED=true
      - JWT_SECRET=qlv6dgceNgPoUyXgWDg3X3nWtvUYScSP
      - LANG=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      # 添加PostgreSQL认证方式配置
      - DB_SSL_MODE=disable
      # 添加环境变量以确保正确的连接超时设置
      - AMQP_CONNECTION_TIMEOUT=30000
      - AMQP_HEARTBEAT=60
    depends_on:
      # 使用服务名称而不是容器名称
      pgDB:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aiccg-boot-redis:
        condition: service_healthy
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - ./fontsCN:/usr/share/fonts/truetype/fontsCN:ro
      # 修复：挂载配置文件目录为可写模式，避免文件锁定问题
      - ./onlyoffice-config/local.json:/etc/onlyoffice/documentserver/local.json
      # 添加证书目录挂载
      - ./onlyoffice-config/certs:/var/www/onlyoffice/Data/certs
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 增强的初始化命令，包含更多优化和错误修复
    command: >
      /bin/sh -c "apt-get update && apt-get install -y locales curl iputils-ping && 
      echo 'zh_CN.UTF-8 UTF-8' >> /etc/locale.gen && locale-gen && 
      sed -i '259s/^.*$$/if [[ $${ERR} != \"\" ]]; then echo \"Warning: Error occurred but continuing anyway\" >&2; fi/' /app/ds/run-document-server.sh && 
      sed -i '259s/^.*$$/if [[ $${ERR} != \"\" ]]; then echo \"Warning: Error occurred but continuing anyway\" >&2; fi/' /app/onlyoffice/run-document-server.sh && 
      mkdir -p /var/www/onlyoffice/Data/certs && chown -R ds:ds /var/www/onlyoffice/Data && 
      chown ds:ds /etc/onlyoffice/documentserver/local.json && chmod 644 /etc/onlyoffice/documentserver/local.json && 
      /app/onlyoffice/run-document-server.sh"

  # GeoServer地图服务器
  geoserver:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/kartoza/geoserver:2.27.2
    container_name: geoserver
    ports:
      - "8081:8080"
    environment:
      - GEOSERVER_DATA_DIR=/opt/geoserver/data_dir
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - GEOSERVER_ADMIN_USER=admin
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    networks:
      - aiccg-networks

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # AICCG Boot系统服务
  aiccg-boot-system:
    build:
      context: ../../jeecg-boot/jeecg-module-system/jeecg-system-start
    restart: on-failure
    depends_on:
      # 使用服务名称而不是容器名称
      - pgDB
      - aiccg-boot-redis
      - aiccg-boot-minio
      - elasticsearch
      - rabbitmq
      - onlyoffice
    container_name: aiccg-boot-system
    image: aiccg-boot-system
    hostname: aiccg-boot-system
    ports:
      - 8082:8080
    environment:
      - POSTGRES_USER_PASSWORD=hkzdlq@CCG2025
      - REDIS_PASSWORD=redispassword123
      - MINIO_ROOT_PASSWORD=minioadmin
      # CAS配置
      - cas.prefixUrl=http://cas.example.org:8443/cas
      # Mindmap配置
      - mindmap.encrypt-key=jeecgboot
    networks:
      - aiccg-networks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/aiccgboot/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Vue前端服务
  aiccg-vue:
    build:
      context: ../../jeecgboot-vue3
    container_name: aiccg-vue3
    image: aiccg-vue3
    depends_on:
      - aiccg-boot-system
    networks:
      - aiccg-networks
    ports:
      - 80:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 持久化卷配置
volumes:
  # PostgreSQL数据卷
  postgres_data:
    external: false
  postgres_backup:
    external: false
  # OnlyOffice数据卷
  onlyoffice_data:
    external: false
  onlyoffice_logs:
    external: false
  onlyoffice_lib:
    external: false
  # MinIO数据卷
  minio_data:
    external: false
  # Redis数据卷
  redis_data:
    external: false
  # RabbitMQ数据卷
  rabbitmq_data:
    external: false
  # Elasticsearch数据卷
  elasticsearch_data:
    external: false
  # GeoServer数据卷
  geoserver_data:
    external: false

# 网络配置
networks:
  aiccg-networks:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16