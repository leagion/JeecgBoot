services:
  # OnlyOffice服务（支持中文环境及字体）
  onlyoffice:
    image: onlyoffice:v1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:80"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=onlyoffice
      - DB_USER=oo_user
      - DB_PASS=hkzdlq@CCG2025
      - JWT_ENABLED=false
    depends_on:
      - postgres
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL服务（使用已构建的PostGIS和pgvector扩展）
  postgres:
    image: pg18-pgvector-postgis:v1.0
    build:
      context: ../../pg18-postgis-vector
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=oo_user
      - POSTGRES_PASSWORD=hkzdlq@CCG2025
      - POSTGRES_MULTIPLE_DATABASES=minio,elasticsearch,rabbitmq,application
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backup
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO对象存储服务
  minio:
    image: minio/minio:latest
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_REGION_NAME=cn-east-1
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Elasticsearch服务
  elasticsearch:
    image: elasticsearch:8.14.0
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=true
      - ELASTIC_PASSWORD=elasticsearch
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存服务
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # RabbitMQ消息队列服务
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理服务
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_conf:/etc/nginx/conf.d
      - nginx_html:/usr/share/nginx/html
      - nginx_logs:/var/log/nginx
    networks:
      - app-network
    depends_on:
      - onlyoffice
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3

# 共享网络配置
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 持久化卷配置
volumes:
  # PostgreSQL数据卷
  postgres_data:
  postgres_backup:
  # OnlyOffice数据卷
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  # MinIO数据卷
  minio_data:
  # Elasticsearch数据卷
  elasticsearch_data:
  # Redis数据卷
  redis_data:
  # RabbitMQ数据卷
  rabbitmq_data:
  # Nginx数据卷
  nginx_conf:
  nginx_html:
  nginx_logs: